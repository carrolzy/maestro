[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-diagnostics"
version = "0.1.0"
description = "Local Chrome Performance trace diagnostics for uni-app and WeChat Mini Program investigations."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
perf-case = "perf_diagnostics.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
